  // Tuning
  const GRAVITY = 0.45;
  const FLAP = -7.8;
  const MAX_FALL = 11;
  const PIPE_W = 70;
  const PIPE_GAP = 180;
  const PIPE_SPACING = 220;
  const SPEED = 2.6;

  const bird = { x: 100, y: H / 2, w: 74, h: 63, vy: 0, rot: 0 };
  let pipes = [];
  let drops = [];
  let score = 0;
  let best = 0;
  let state = "ready"; // ready | playing | dead
  let groundX = 0;
  let frame = 0;
  let deadAt = 0;

  try { best = parseInt(localStorage.getItem("flappyToma.best"), 10) || 0; } catch (e) {}

  function saveBest() {
    try { localStorage.setItem("flappyToma.best", String(best)); } catch (e) {}
  }

  function reset() {
    bird.y = H / 2;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    drops = [];
    score = 0;
    frame = 0;
    state = "ready";
  }

  function spawnPipe(x) {
    const minTop = 60;
    const maxTop = H - GROUND_H - PIPE_GAP - 60;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x, top, passed: false });
  }

  function spray() {
    // TOMA does what TOMA does: blast water out the nose
    for (let i = 0; i < 14; i++) {
      drops.push({
        x: bird.x + bird.w * 0.2,
        y: bird.y + bird.h * 0.15,
        vx: -3 - Math.random() * 4,
        vy: 1 + Math.random() * 3,
        life: 30 + Math.random() * 15,
        r: 2 + Math.random() * 3,
      });
    }
  }

  function flap() {
    if (state === "dead") {
      if (performance.now() - deadAt > 500) reset();
      return;
    }
    if (state === "ready") {
      state = "playing";
      spawnPipe(W + 40);
    }
    bird.vy = FLAP;
    spray();
  }

  function die() {
    if (state === "dead") return;
    state = "dead";
    deadAt = performance.now();
    if (score > best) {
      best = score;
      saveBest();
    }
  }

  // Input
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      flap();
    }
  });
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    flap();
  });

  function hits(p) {
    // Slightly forgiving hitbox
    const pad = 8;
    const bx = bird.x - bird.w / 2 + pad;
    const by = bird.y - bird.h / 2 + pad;
    const bw = bird.w - pad * 2;
    const bh = bird.h - pad * 2;
    if (bx + bw < p.x || bx > p.x + PIPE_W) return false;
    return by < p.top || by + bh > p.top + PIPE_GAP;
  }

  function update() {
    frame++;

    if (state !== "dead") {
      groundX = (groundX - SPEED) % 24;
    }

    if (state === "ready") {
      bird.y = H / 2 + Math.sin(frame / 12) * 8;
    } else {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      const target = Math.max(-0.45, Math.min(1.3, bird.vy / 9));
      bird.rot += (target - bird.rot) * 0.2;

      if (bird.y + bird.h / 2 >= H - GROUND_H) {
        bird.y = H - GROUND_H - bird.h / 2;
        bird.vy = 0;
        die();
      }
      if (bird.y - bird.h / 2 < 0) {
        bird.y = bird.h / 2;
        bird.vy = 0;
      }
    }

    if (state === "playing") {
      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.passed && p.x + PIPE_W < bird.x - bird.w / 2) {
          p.passed = true;
          score++;
        }
        if (hits(p)) die();
      }
      const last = pipes[pipes.length - 1];
      if (last && last.x < W - PIPE_SPACING) spawnPipe(W);
      pipes = pipes.filter((p) => p.x + PIPE_W > -10);
    }

    for (const d of drops) {
      d.x += d.vx;
      d.y += d.vy;
      d.vy += 0.25;
      d.life--;
    }
    drops = drops.filter((d) => d.life > 0);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#5ab8e8");
    g.addColorStop(1, "#bfe7f7");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // clouds
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    const cloudOffset = (frame * 0.4) % (W + 200);
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 180 - cloudOffset) % (W + 200) + W + 200) % (W + 200) - 100;
      const cy = 90 + i * 70;
      ctx.beginPath();
      ctx.arc(cx, cy, 24, 0, Math.PI * 2);
      ctx.arc(cx + 28, cy - 10, 30, 0, Math.PI * 2);
      ctx.arc(cx + 60, cy, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    // skyline
    ctx.fillStyle = "#8fc9a0";
    for (let i = 0; i < 12; i++) {
      const bw = 40;
      const bh = 40 + ((i * 37) % 70);
      ctx.fillRect(i * bw - 10, H - GROUND_H - bh, bw - 4, bh);
    }
  }

  function drawPipe(x, y, h, flipped) {
    ctx.fillStyle = "#5bbf3a";
    ctx.fillRect(x, y, PIPE_W, h);
    ctx.fillStyle = "#79dd55";
    ctx.fillRect(x + 6, y, 10, h);
    ctx.strokeStyle = "#2d6a1d";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, PIPE_W, h);
    const capH = 26;
    const capY = flipped ? y + h - capH : y;
    ctx.fillStyle = "#5bbf3a";
    ctx.fillRect(x - 5, capY, PIPE_W + 10, capH);
    ctx.fillStyle = "#79dd55";
    ctx.fillRect(x + 1, capY, 10, capH);
    ctx.strokeRect(x - 5, capY, PIPE_W + 10, capH);
  }

  function drawPipes() {
    for (const p of pipes) {
      drawPipe(p.x, 0, p.top, true);
      const by = p.top + PIPE_GAP;
      drawPipe(p.x, by, H - GROUND_H - by, false);
    }
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = "#73bf2e";
    ctx.fillRect(0, y, W, 16);
    ctx.fillStyle = "#5a9a22";
    for (let x = groundX; x < W; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.lineTo(x + 12, y + 16);
      ctx.lineTo(x + 6, y);
      ctx.fill();
    }
    ctx.strokeStyle = "#543847";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBird() {
    ctx.fillStyle = "rgba(210,240,255,0.9)";
    for (const d of drops) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const x = -bird.w / 2;
    const y = -bird.h / 2;
    roundRect(x, y, bird.w, bird.h, 12);
    ctx.save();
    ctx.clip();
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, x, y, bird.w, bird.h);
    } else {
      ctx.fillStyle = "#f4d03f";
      ctx.fillRect(x, y, bird.w, bird.h);
    }
    ctx.restore();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#222";
    roundRect(x, y, bird.w, bird.h, 12);
    ctx.stroke();

    // flapping wing so it's still technically a bird
    const wingUp = state !== "dead" && Math.floor(frame / 5) % 2 === 0;
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x + 4, wingUp ? y + 14 : y + 30, 14, 8, wingUp ? -0.5 : 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function outlinedText(text, x, y, size, fill = "#fff") {
    ctx.font = `${size}px "Arial Black", Impact, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(4, size / 7);
    ctx.strokeStyle = "#222";
    ctx.lineJoin = "round";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawUI() {
    if (state === "playing") {
      outlinedText(String(score), W / 2, 70, 52);
    }

    if (state === "ready") {
      outlinedText("FLAPPY", W / 2, 120, 50, "#ffd23f");
      outlinedText("TOMA", W / 2, 175, 64, "#e63946");
      outlinedText("Tap / Space to flap", W / 2, H - GROUND_H - 60, 20);
      if (best > 0) outlinedText(`Best: ${best}`, W / 2, H - GROUND_H - 30, 18);
    }

    if (state === "dead") {
      outlinedText("GAME OVER", W / 2, 150, 44, "#e63946");
      ctx.fillStyle = "#ded895";
      ctx.strokeStyle = "#543847";
      ctx.lineWidth = 4;
      roundRect(W / 2 - 110, 200, 220, 130, 14);
      ctx.fill();
      ctx.stroke();
      outlinedText("SCORE", W / 2 - 50, 235, 18, "#e8743b");
      outlinedText(String(score), W / 2 - 50, 280, 40);
      outlinedText("BEST", W / 2 + 50, 235, 18, "#e8743b");
      outlinedText(String(best), W / 2 + 50, 280, 40);
      if (score > 0 && score === best) outlinedText("NEW BEST!", W / 2, 355, 20, "#ffd23f");
      if (performance.now() - deadAt > 500) {
        outlinedText("Tap to try again", W / 2, 410, 22);
      }
    }
  }

  function render() {
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();
    drawUI();
  }

  // Fixed-timestep loop so speed is the same on 60Hz and 144Hz screens
  const STEP = 1000 / 60;
  let last = performance.now();
  let acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  // Fit canvas to screen while keeping aspect ratio
  function fit() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = `${Math.floor(W * scale)}px`;
    canvas.style.height = `${Math.floor(H * scale)}px`;
  }
  window.addEventListener("resize", fit);
  fit();

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
