  // The photo doesn't tile, so crossfade its right edge into its left edge
  // to hide the seam, and bake the darkening overlay in while we're at it.
  // Built at the photo's own resolution so it stays sharp on tall, high-DPI phones
  function buildBgTile() {
    const h = bg.naturalHeight;
    const w = bg.naturalWidth;
    const ov = Math.round(w * 0.15);
    const tile = document.createElement("canvas");
    tile.width = w - ov;
    tile.height = h;
    const tc = tile.getContext("2d");
    tc.drawImage(bg, 0, 0, w, h);

    const edge = document.createElement("canvas");
    edge.width = ov;
    edge.height = h;
    const ec = edge.getContext("2d");
    ec.drawImage(bg, -(w - ov), 0, w, h);
    ec.globalCompositeOperation = "destination-in";
    const g = ec.createLinearGradient(0, 0, ov, 0);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ec.fillStyle = g;
    ec.fillRect(0, 0, ov, h);
    tc.drawImage(edge, 0, 0);

    tc.fillStyle = "rgba(25, 10, 0, 0.2)";
    tc.fillRect(0, 0, tile.width, h);
    bgTile = tile;
  }

  // Tuning
  const GRAVITY = 0.45;
  const FLAP = -7.8;
  const MAX_FALL = 11;
  const PIPE_W = 70;
  const PIPE_GAP = 185;
  const PIPE_SPACING = 220;
  const SPEED = 2.6;
  const BG_SPEED = 0.6;

  // The TOMA is drawn in a ~110x85 design space and scaled down
  const TOMA_SCALE = 0.9;
  // Body + head in design units, a little forgiving at the edges
  const HITBOX = { x: -46 * TOMA_SCALE, y: -24 * TOMA_SCALE, w: 90 * TOMA_SCALE, h: 62 * TOMA_SCALE };
  const NOZZLE = { x: -58, y: -9 };

  const bird = { x: 110, y: H / 2, vy: 0, rot: 0 };
  let pipes = [];
  let drops = [];
  let score = 0;
  let best = 0;
  let state = "ready"; // ready | playing | dead
  let groundX = 0;
  let bgX = 0;
  let frame = 0;
  let deadAt = 0;

  try { best = parseInt(localStorage.getItem("flappyToma.best"), 10) || 0; } catch (e) {}

  function saveBest() {
    try { localStorage.setItem("flappyToma.best", String(best)); } catch (e) {}
  }

  function rng(seed) {
    return () => {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function reset() {
    bird.y = H / 2;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    drops = [];
    score = 0;
    frame = 0;
    state = "ready";
  }

  function spawnPipe(x) {
    const minTop = 70;
    const maxTop = GROUND_Y - PIPE_GAP - 70;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x, top, passed: false, seed: (Math.random() * 1e9) | 0 });
  }

  // World position of the rear water nozzle
  function nozzlePos() {
    const nx = NOZZLE.x * TOMA_SCALE;
    const ny = NOZZLE.y * TOMA_SCALE;
    const c = Math.cos(bird.rot);
    const s = Math.sin(bird.rot);
    return { x: bird.x + nx * c - ny * s, y: bird.y + nx * s + ny * c };
  }

  function emit(count, speedMin, speedMax, spread) {
    const n = nozzlePos();
    // Spray backwards and a bit down, following the truck's tilt
    const base = Math.PI + 0.45 + bird.rot;
    for (let i = 0; i < count; i++) {
      const a = base + (Math.random() - 0.5) * spread;
      const sp = speedMin + Math.random() * (speedMax - speedMin);
      drops.push({
        x: n.x,
        y: n.y,
        vx: Math.cos(a) * sp - SPEED * 0.5,
        vy: Math.sin(a) * sp,
        life: 25 + Math.random() * 20,
        r: 1.5 + Math.random() * 3,
      });
    }
  }

  function flap() {
    if (state === "dead") {
      if (performance.now() - deadAt > 500) reset();
      return;
    }
    if (state === "ready") {
      state = "playing";
      spawnPipe(W + 40);
    }
    bird.vy = FLAP;
    emit(26, 5, 10, 0.5);
  }

  function die() {
    if (state === "dead") return;
    state = "dead";
    deadAt = performance.now();
    if (score > best) {
      best = score;
      saveBest();
    }
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      flap();
    }
  });
  // Tap anywhere, including the letterbox bars
  window.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    flap();
  });
  // Stop iOS double-tap zoom, scroll bounce and the long-press menu
  document.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  function hits(p) {
    const bx = bird.x + HITBOX.x;
    const by = bird.y + HITBOX.y;
    if (bx + HITBOX.w < p.x || bx > p.x + PIPE_W) return false;
    return by < p.top || by + HITBOX.h > p.top + PIPE_GAP;
  }

  function update() {
    frame++;

    if (state !== "dead") {
      groundX = (groundX - SPEED) % 28;
      bgX -= BG_SPEED;
    }

    if (state === "ready") {
      bird.y = H / 2 + Math.sin(frame / 12) * 8;
      if (frame % 3 === 0) emit(1, 2, 4, 0.4);
    } else {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      const target = Math.max(-0.4, Math.min(1.1, bird.vy / 10));
      bird.rot += (target - bird.rot) * 0.2;

      if (bird.y + HITBOX.y + HITBOX.h >= GROUND_Y) {
        bird.y = GROUND_Y - HITBOX.y - HITBOX.h;
        bird.vy = 0;
        die();
      }
      if (bird.y + HITBOX.y < 0) {
        bird.y = -HITBOX.y;
        bird.vy = 0;
      }
      // Constant trickle so it always looks water-powered
      if (state === "playing") emit(2, 3, 6, 0.35);
    }

    if (state === "playing") {
      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.passed && p.x + PIPE_W < bird.x + HITBOX.x) {
          p.passed = true;
          score++;
        }
        if (hits(p)) die();
      }
      const last = pipes[pipes.length - 1];
      if (last && last.x < W - PIPE_SPACING) spawnPipe(W);
      pipes = pipes.filter((p) => p.x + PIPE_W > -20);
    }

    for (const d of drops) {
      d.x += d.vx;
      d.y += d.vy;
      d.vy += 0.3;
      d.life--;
    }
    drops = drops.filter((d) => d.life > 0 && d.y < GROUND_Y);
  }

  // ---------- drawing helpers ----------

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function ellipse(x, y, rx, ry, fill, stroke, lw = 2) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }

  function star(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 === 0 ? r : r * 0.4;
      ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------- background ----------

  function drawBackground() {
    if (bgTile) {
      const w = bgTile.width * (GROUND_Y / bgTile.height);
      const off = ((bgX % w) + w) % w;
      for (let x = -off; x < W; x += w) ctx.drawImage(bgTile, x, 0, w + 0.5, GROUND_Y);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      g.addColorStop(0, "#f6c27a");
      g.addColorStop(1, "#b5623a");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, GROUND_Y);
    }
  }

  // ---------- zurna dürüm pipes ----------

  function drawDurum(p, y0, y1, openAtBottom) {
    const x = p.x;
    const len = y1 - y0;
    const openY = openAtBottom ? y1 : y0;
    const farY = openAtBottom ? y0 : y1;
    const dir = openAtBottom ? -1 : 1; // from open end toward far end
    const r = rng(p.seed + (openAtBottom ? 1 : 2));

    // Lavash tube
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, "#b8773a");
    g.addColorStop(0.3, "#f2d49c");
    g.addColorStop(0.55, "#ecc98c");
    g.addColorStop(1, "#a9682f");
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, PIPE_W, len);

    // Rolled seams and grill marks, laid out from the open end so they don't jitter
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y0, PIPE_W, len);
    ctx.clip();
    ctx.strokeStyle = "rgba(130, 75, 30, 0.45)";
    ctx.lineWidth = 2;
    for (let d = 40; d < len + 40; d += 55) {
      const yy = openY + dir * d;
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.quadraticCurveTo(x + PIPE_W / 2, yy + dir * 14, x + PIPE_W, yy + dir * 4);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(110, 55, 15, 0.5)";
    for (let d = 20; d < len; d += 18) {
      const yy = openY + dir * d;
      const xx = x + 10 + r() * (PIPE_W - 20);
      ctx.beginPath();
      ctx.ellipse(xx, yy, 4 + r() * 3, 1.8, -0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.strokeStyle = "#5e3410";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    ctx.moveTo(x + PIPE_W, y0);
    ctx.lineTo(x + PIPE_W, y1);
    ctx.stroke();

    // Paper sleeve on the far end
    const sleeve = Math.min(170, len - 80);
    if (sleeve > 20) {
      const sy = openAtBottom ? farY : farY - sleeve;
      const edgeY = openAtBottom ? farY + sleeve : farY - sleeve;
      ctx.fillStyle = "#f7f1e3";
      ctx.beginPath();
      if (openAtBottom) {
        ctx.moveTo(x - 4, sy);
        ctx.lineTo(x + PIPE_W + 4, sy);
        for (let i = 0; i <= 8; i++) {
          ctx.lineTo(x + PIPE_W + 4 - (i * (PIPE_W + 8)) / 8, edgeY + (i % 2 ? 7 : 0));
        }
      } else {
        ctx.moveTo(x - 4, sy + sleeve);
        ctx.lineTo(x + PIPE_W + 4, sy + sleeve);
        for (let i = 0; i <= 8; i++) {
          ctx.lineTo(x + PIPE_W + 4 - (i * (PIPE_W + 8)) / 8, edgeY - (i % 2 ? 7 : 0));
        }
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#5e3410";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#d7262e";
      const stripeY = openAtBottom ? edgeY - 16 : edgeY + 8;
      ctx.fillRect(x - 4, stripeY, PIPE_W + 8, 5);
      ctx.fillRect(x - 4, stripeY + (openAtBottom ? -9 : 9), PIPE_W + 8, 3);

      // Label hangs just past the stripes so it stays on screen
      if (sleeve >= 165) {
        ctx.save();
        ctx.translate(x + PIPE_W / 2, edgeY + (openAtBottom ? -82 : 82));
        ctx.rotate(-Math.PI / 2);
        ctx.font = 'bold 13px "Arial Black", Impact, sans-serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#d7262e";
        ctx.fillText("ZURNA DÜRÜM", 0, 0);
        ctx.restore();
      }
    }

    // Open end with the filling showing
    const cx = x + PIPE_W / 2;
    // stuff poking out of the wrap
    for (let i = 0; i < 6; i++) {
      const px = x + 8 + r() * (PIPE_W - 16);
      const green = r() < 0.6;
      ellipse(px, openY - dir * (4 + r() * 5), 5 + r() * 4, 3.5, green ? "#58a832" : "#d63a2a", "#2f4a14", 1);
    }
    ellipse(cx, openY, PIPE_W / 2 + 3, 12, "#f0cf98", "#5e3410", 3);
    ellipse(cx, openY, PIPE_W / 2 - 6, 7.5, "#7b3a19");
    const bits = ["#4e2209", "#9c4a22", "#d63a2a", "#58a832", "#f4ecf4", "#8a2be2"];
    for (let i = 0; i < 16; i++) {
      const a = r() * Math.PI * 2;
      const rr = Math.sqrt(r());
      const bx = cx + Math.cos(a) * rr * (PIPE_W / 2 - 10);
      const by = openY + Math.sin(a) * rr * 5;
      ctx.fillStyle = bits[i % bits.length];
      ctx.beginPath();
      ctx.arc(bx, by, 1.5 + r() * 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of pipes) {
      drawDurum(p, -20, p.top, true);
      drawDurum(p, p.top + PIPE_GAP, GROUND_Y + 20, false);
    }
  }

  // ---------- ground: cobblestones ----------

  function drawGround() {
    ctx.fillStyle = "#4a3222";
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    for (let row = 0; row < 4; row++) {
      const y = GROUND_Y + 12 + row * 18;
      const shift = row % 2 ? 14 : 0;
      for (let x = groundX - 28 + shift; x < W + 28; x += 28) {
        const shade = ((Math.round((x - groundX) / 28) + row) % 3);
        ctx.fillStyle = ["#8a6446", "#7a5639", "#94704f"][shade];
        roundRect(x + 2, y, 24, 14, 6);
        ctx.fill();
        ctx.strokeStyle = "#2e1d12";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#c9ae86";
    ctx.fillRect(0, GROUND_Y, W, 7);
    ctx.strokeStyle = "#2e1d12";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.moveTo(0, GROUND_Y + 7);
    ctx.lineTo(W, GROUND_Y + 7);
    ctx.stroke();
  }

  // ---------- the TOMA ----------

  function drawFlag(t) {
    // pole
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-22, -14);
    ctx.lineTo(-22, -46);
    ctx.stroke();

    // waving cloth, flying backwards
    const top = -46, bot = -30, x0 = -22, x1 = -48;
    const wave = (x) => Math.sin(t / 5 + x / 5) * 2.5 * ((x0 - x) / (x0 - x1));
    ctx.beginPath();
    ctx.moveTo(x0, top);
    for (let x = x0; x >= x1; x -= 2) ctx.lineTo(x, top + wave(x));
    for (let x = x1; x <= x0; x += 2) ctx.lineTo(x, bot + wave(x));
    ctx.closePath();
    ctx.fillStyle = "#e30a17";
    ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // crescent and star (mirrored since the flag flies left)
    const my = (top + bot) / 2 + wave(-30);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-30, my, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e30a17";
    ctx.beginPath();
    ctx.arc(-31.3, my, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    star(-38, my, 2.8);
  }

  function drawToma(t) {
    const dead = state === "dead";

    drawFlag(t);

    // wheels
    for (const wx of [-30, 14]) {
      ellipse(wx, 30, 11, 11, "#1e1e1e", "#000", 2);
      ellipse(wx, 30, 4.5, 4.5, "#9a9a9a");
    }

    // rear water cannon
    ctx.fillStyle = "#6f7780";
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2;
    roundRect(-60, -13, 18, 8, 3);
    ctx.fill();
    ctx.stroke();
    ellipse(-44, -14, 6, 6, "#8a929b", "#222", 2);

    // armored body
    roundRect(-50, -16, 68, 44, 9);
    ctx.fillStyle = "#eef1f4";
    ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#2b5fa8";
    ctx.fillRect(-48, 9, 64, 6);
    roundRect(-42, -9, 20, 13, 3);
    ctx.fillStyle = "#9cc3dd";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#222";
    ctx.font = 'bold 7px "Arial Black", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("TOMA", -14, 22);

    // siren
    const blink = Math.floor(t / 8) % 2 === 0;
    roundRect(-16, -22, 18, 7, 2);
    ctx.fillStyle = blink ? "#2f7bff" : "#ff3b3b";
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // --- the face on the front ---
    const skin = "#f1bb91";
    const hx = 24, hy = -2;

    // ears
    ellipse(hx - 22, hy + 2, 8, 12, skin, "#222", 2);
    ellipse(hx - 22, hy + 2, 4, 7, "#dc8f6c");
    ellipse(hx + 22, hy + 2, 8, 12, skin, "#222", 2);
    ellipse(hx + 22, hy + 2, 4, 7, "#dc8f6c");

    // head
    ellipse(hx, hy, 21, 25, skin, "#222", 2.5);

    // side hair
    ctx.fillStyle = "#4d4d4d";
    ctx.beginPath();
    ctx.ellipse(hx - 17, hy - 11, 4.5, 8, 0.3, 0, Math.PI * 2);
    ctx.ellipse(hx + 17, hy - 11, 4.5, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // forehead wrinkles
    ctx.strokeStyle = "#b47a55";
    ctx.lineWidth = 1.3;
    for (const wy of [-20, -16.5]) {
      ctx.beginPath();
      ctx.moveTo(hx - 9, hy + wy + 1);
      ctx.quadraticCurveTo(hx, hy + wy - 2, hx + 9, hy + wy + 1);
      ctx.stroke();
    }

    // golden dome with crescent on top of the head
    ctx.fillStyle = "#e8b923";
    ctx.strokeStyle = "#7a5a00";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy - 24, 7, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx, hy - 31);
    ctx.lineTo(hx, hy - 34);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hx, hy - 38, 4.2, 0, Math.PI * 2);
    ctx.arc(hx + 1.3, hy - 38.8, 3.3, 0, Math.PI * 2, true);
    ctx.fill("evenodd");

    // angry brows
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx - 14, hy - 11);
    ctx.lineTo(hx - 3, hy - 7);
    ctx.moveTo(hx + 14, hy - 11);
    ctx.lineTo(hx + 3, hy - 7);
    ctx.stroke();
    ctx.lineCap = "butt";

    // eyes
    if (dead) {
      ctx.strokeStyle = "#222";
      ctx.lineWidth = 2;
      for (const ex of [hx - 8, hx + 8]) {
        ctx.beginPath();
        ctx.moveTo(ex - 3.5, hy - 5.5);
        ctx.lineTo(ex + 3.5, hy + 0.5);
        ctx.moveTo(ex + 3.5, hy - 5.5);
        ctx.lineTo(ex - 3.5, hy + 0.5);
        ctx.stroke();
      }
    } else {
      for (const ex of [hx - 8, hx + 8]) {
        ellipse(ex, hy - 2.5, 5, 4.5, "#fff", "#222", 1.5);
        ellipse(ex + 0.5, hy - 4, 2.4, 2.4, "#4d89b8");
        ellipse(ex + 0.5, hy - 4, 1.1, 1.1, "#111");
      }
    }
    ctx.strokeStyle = "#a0664a";
    ctx.lineWidth = 1.3;
    for (const ex of [hx - 8, hx + 8]) {
      ctx.beginPath();
      ctx.arc(ex, hy + 1, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // nose
    ellipse(hx + 1, hy + 6, 5, 6, "#e6a37c", "#7a4a33", 1.5);

    // moustache
    ctx.fillStyle = "#7d7d7d";
    ctx.beginPath();
    ctx.ellipse(hx - 4, hy + 12.5, 6, 3, 0.15, 0, Math.PI * 2);
    ctx.ellipse(hx + 4, hy + 12.5, 6, 3, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // pouty lips
    if (dead) {
      ellipse(hx, hy + 18, 3.5, 4, "#5a1a22", "#222", 1.5);
    } else {
      ellipse(hx, hy + 17.5, 5.5, 3.5, "#d45a6a", "#7a2a33", 1.5);
      ctx.strokeStyle = "#7a2a33";
      ctx.beginPath();
      ctx.moveTo(hx - 4.5, hy + 17.5);
      ctx.lineTo(hx + 4.5, hy + 17.5);
      ctx.stroke();
    }
  }

  function drawWater() {
    for (const d of drops) {
      const a = Math.min(1, d.life / 20);
      ctx.fillStyle = `rgba(170, 220, 255, ${0.85 * a})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * a})`;
      ctx.beginPath();
      ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBird() {
    drawWater();
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.scale(TOMA_SCALE, TOMA_SCALE);
    drawToma(frame);
    ctx.restore();
  }

  // ---------- UI ----------

  function outlinedText(text, x, y, size, fill = "#fff") {
    ctx.font = `${size}px "Arial Black", Impact, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(4, size / 7);
    ctx.strokeStyle = "#222";
    ctx.lineJoin = "round";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawUI() {
    if (state === "playing") {
      outlinedText(String(score), W / 2, 70, 52);
    }

    const oy = (H - 640) / 2;

    if (state === "ready") {
      outlinedText("FLAPPY", W / 2, 110 + oy * 0.5, 50, "#ffd23f");
      outlinedText("TOMA", W / 2, 165 + oy * 0.5, 64, "#e63946");
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      roundRect(W / 2 - 150, GROUND_Y - 95, 300, 80, 12);
      ctx.fill();
      outlinedText(isTouch ? "Uçmak için ekrana dokun" : "Uçmak için tıkla / Boşluk", W / 2, GROUND_Y - 70, 18);
      outlinedText(best > 0 ? `En iyi: ${best}` : "Dürümlere çarpma!", W / 2, GROUND_Y - 40, 16, "#ffd23f");
    }

    if (state === "dead") {
      outlinedText("OYUN BİTTİ", W / 2, 150 + oy, 44, "#e63946");
      ctx.fillStyle = "#f7f1e3";
      ctx.strokeStyle = "#5e3410";
      ctx.lineWidth = 4;
      roundRect(W / 2 - 110, 200 + oy, 220, 130, 14);
      ctx.fill();
      ctx.stroke();
      outlinedText("SKOR", W / 2 - 50, 235 + oy, 18, "#e8743b");
      outlinedText(String(score), W / 2 - 50, 280 + oy, 40);
      outlinedText("EN İYİ", W / 2 + 50, 235 + oy, 18, "#e8743b");
      outlinedText(String(best), W / 2 + 50, 280 + oy, 40);
      if (score > 0 && score === best) outlinedText("YENİ REKOR!", W / 2, 355 + oy, 20, "#ffd23f");
      if (performance.now() - deadAt > 500) {
        outlinedText("Tekrar için dokun", W / 2, 410 + oy, 22);
      }
    }
  }

  function render() {
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();
    drawUI();
  }

  // Fixed-timestep loop so speed is the same on 60Hz and 144Hz screens
  const STEP = 1000 / 60;
  let last = performance.now();
  let acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  // Fit canvas to screen while keeping aspect ratio
  function fit() {
    // Measure the body, not the window, so safe-area padding is respected
    const vw = document.body.clientWidth || window.innerWidth;
    const vh = document.body.clientHeight || window.innerHeight;
    // Only reshape the world between rounds, never mid-flight
    if (state !== "playing") {
      const want = vh / vw > 640 / 400 ? Math.round((W * vh) / vw) : 640;
      const newH = Math.max(600, Math.min(900, want));
      if (newH !== H) {
        H = newH;
        GROUND_Y = H - GROUND_H;
        if (state === "ready") bird.y = H / 2;
      }
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const scale = Math.min(vw / W, vh / H);
    canvas.style.width = `${Math.floor(W * scale)}px`;
    canvas.style.height = `${Math.floor(H * scale)}px`;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  // Don't let the game fast-forward after the tab was in the background
  document.addEventListener("visibilitychange", () => {
    last = performance.now();
    acc = 0;
  });
  fit();

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
